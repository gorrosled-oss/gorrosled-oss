<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>LED Timeline Controller</title>
  <style>
    body{font-family:Arial,Helvetica,sans-serif;padding:16px}
    #waveform{width:100%;height:128px;background:#111;margin-bottom:8px}
    .controls{margin:8px 0}
  </style>
  <script src="https://unpkg.com/wavesurfer.js"></script>
</head>
<body>
  <h2>LED Timeline (demo)</h2>
  <input type="file" id="file" accept="audio/*">
  <div id="waveform"></div>
  <div class="controls">
    <button id="play">Play / Pause</button>
    <label>Num LEDs: <input id="num_leds" type="number" value="60" min="1" max="5000"></label>
    <select id="effect">
      <option value="solid">Solid</option>
      <option value="rainbow">Rainbow</option>
      <option value="pulse">Pulse</option>
    </select>
    <input type="color" id="color" value="#ff0000">
    <button id="sendCue">Enviar Cue ahora</button>
  </div>

  <p>WebSocket: <span id="wsstatus">disconnected</span></p>

  <script>
    // Replace with your ESP IP
    const ESP_IP = prompt('Enter ESP WebSocket address (eg ws://192.168.4.1:81)');
    const ws = new WebSocket(ESP_IP);
    const wsstatus = document.getElementById('wsstatus');
    ws.addEventListener('open', ()=> wsstatus.textContent = 'connected');
    ws.addEventListener('close', ()=> wsstatus.textContent = 'disconnected');
    ws.addEventListener('message', (m)=> console.log('recv', m.data));

    document.getElementById('num_leds').addEventListener('change', () => {
      const n = parseInt(document.getElementById('num_leds').value);
      ws.send(JSON.stringify({cmd:'set_config', num_leds:n}));
    });

    document.getElementById('sendCue').addEventListener('click', () => {
      const effect = document.getElementById('effect').value;
      const color = document.getElementById('color').value;
      ws.send(JSON.stringify({cmd:'cue', effect:effect, color:color}));
    });

    const wavesurfer = WaveSurfer.create({ container: '#waveform', waveColor: '#66c', progressColor:'#ff7' });
    document.getElementById('file').addEventListener('change', (e) => {
      const f = e.target.files[0];
      if (f) wavesurfer.loadBlob(f);
    });
    document.getElementById('play').addEventListener('click', () => {
      wavesurfer.playPause();
    });

    // Example: send cue when playback reaches a time (simple demo)
    // In a full editor you would create regions and schedule cues
    wavesurfer.on('audioprocess', (time) => {
      // placeholder for realtime cueing
    });
  </script>
</body>
</html>
